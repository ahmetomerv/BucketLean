# Single-replica self-host layout for Coolify, Docker Compose, or similar.
# SQLite WAL and the in-process worker require exactly one app instance and a
# local (non-NFS) volume for /app/data.
services:
  bucketlean:
    build: .
    image: bucketlean:local
    ports:
      - "3000:3000"
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_PATH: /app/data/optimizer.sqlite
      NITRO_HOST: 0.0.0.0
      NITRO_PORT: "3000"
    volumes:
      - bucketlean-data:/app/data
    restart: unless-stopped
    deploy:
      replicas: 1
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/api/health').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

volumes:
  bucketlean-data:
